# mkscene.py の設定ファイルの例（pt mkscene samples/layer1/scene.toml）
# 背景（g1、8 枚）はキャラ（g0、12 枚）が 2 ループする間に 1 ループ。

name = "lay2"
clock = "10mhz"
loops = 2          # 基準の層（chara）を 2 ループ
diff = true
timelog = true

[[layer]]
name = "chara"
plane = "g0"       # 手前。PNG の透明な所は奥が見える
src = "chara"
base = true
fps = 12           # 12 枚で 1 秒

[[layer]]
name = "bg"
plane = "g1"       # 奥
src = "bg"
loop_ratio = 2.0   # 背景 1 ループ＝キャラ 2 ループ（背景はゆっくり）
