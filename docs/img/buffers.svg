<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="'Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13">
  <!-- 4 か所の入れ物（buffers = 4）と分割描画：G0 の 512x512 を 256x256 の 4 か所に分け、見えていない所に描いてスクロールで切り替える -->
  <rect width="760" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- 左：G0 の 512x512 -->
  <text x="20" y="26" font-weight="bold">G0 の面（512x512）＝ 入れ物 4 つ</text>
  <g stroke="#666" stroke-width="1">
    <rect x="30" y="50" width="110" height="110" fill="#fbe3c4"/>
    <rect x="140" y="50" width="110" height="110" fill="#dce8f8"/>
    <rect x="30" y="160" width="110" height="110" fill="#e6f4e6"/>
    <rect x="140" y="160" width="110" height="110" fill="#f1f1f1"/>
  </g>
  <rect x="31.5" y="51.5" width="107" height="107" fill="none" stroke="#e08a00" stroke-width="4"/>
  <g font-size="11" fill="#777" font-family="Consolas,'Courier New',monospace">
    <text x="34" y="64">(0,0)</text><text x="144" y="64">(256,0)</text>
    <text x="34" y="174">(0,256)</text><text x="144" y="174">(256,256)</text>
  </g>
  <g text-anchor="middle">
    <text x="85" y="104" font-size="22" font-weight="bold">A</text><text x="85" y="126" font-size="12">表示中</text>
    <text x="195" y="104" font-size="22" font-weight="bold">B</text><text x="195" y="126" font-size="12">描いている</text>
    <text x="85" y="214" font-size="22" font-weight="bold">C</text><text x="85" y="236" font-size="12">前に描いた</text>
    <text x="195" y="214" font-size="22" font-weight="bold">D</text><text x="195" y="236" font-size="12">先回りで描く</text>
  </g>
  <line x1="22" y1="160" x2="258" y2="160" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="30" y="292" font-size="12" fill="#444">画面に出るのは、太枠（スクロールの位置）の</text>
  <text x="30" y="308" font-size="12" fill="#444">256x256 だけ。<tspan fill="#c0392b">buffers = 2 では、破線より</tspan></text>
  <text x="30" y="324" font-size="12" fill="#c0392b">上の 2 か所を交互に使う。</text>

  <!-- 右：時間の流れ（1 区切り＝1 回の待ち） -->
  <text x="300" y="26" font-weight="bold">時間の流れ（区切り＝待ち 1 回）</text>
  <g stroke="#bbb" stroke-dasharray="3 3">
    <line x1="300" y1="44" x2="300" y2="196"/><line x1="410" y1="44" x2="410" y2="196"/><line x1="520" y1="44" x2="520" y2="196"/>
    <line x1="630" y1="44" x2="630" y2="196"/><line x1="740" y1="44" x2="740" y2="196"/>
  </g>

  <text x="300" y="60" font-size="12" fill="#444">画面に出ている絵</text>
  <g stroke="#fff">
    <rect x="300" y="66" width="220" height="30" fill="#f2a541"/>
    <rect x="520" y="66" width="110" height="30" fill="#4a7bd0"/>
    <rect x="630" y="66" width="110" height="30" fill="#4a9a4a"/>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="410" y="86">A</text><text x="575" y="86" fill="#fff">B</text><text x="685" y="86" fill="#fff">C</text>
  </g>

  <text x="300" y="130" font-size="12" fill="#444">見えない入れ物に描いているもの</text>
  <g stroke="#fff" font-size="12">
    <rect x="304" y="136" width="44" height="30" fill="#4a7bd0"/>
    <rect x="348" y="136" width="44" height="30" fill="#4a7bd0"/>
    <rect x="414" y="136" width="44" height="30" fill="#4a7bd0"/>
    <rect x="524" y="136" width="44" height="30" fill="#888"/>
    <rect x="568" y="136" width="44" height="30" fill="#888"/>
    <rect x="634" y="136" width="44" height="30" fill="#888"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#fff">
    <text x="326" y="156">B1</text><text x="370" y="156">B2</text><text x="436" y="156">B3</text>
    <text x="546" y="156">D1</text><text x="590" y="156">D2</text><text x="656" y="156">D3</text>
  </g>

  <g font-size="14" font-weight="bold" fill="#c0392b">
    <text x="466" y="157">①</text><text x="526" y="122">②</text><text x="636" y="122">③</text><text x="686" y="157">④</text>
  </g>

  <!-- 切り替えの説明 -->
  <line x1="520" y1="200" x2="520" y2="102" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="630" y1="200" x2="630" y2="102" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <g font-size="12" fill="#222">
    <text x="300" y="222">① B は 1 回の待ちに描き切れないので、2 回に分けて描く（分割描画）。</text>
    <text x="300" y="240">　 B1・B2… は 1 つ 8ms ほどのセル。描きかけは見えない入れ物の中。</text>
    <text x="300" y="262">② 描き終わった B に、スクロールで切り替える（一瞬で替わる）。</text>
    <text x="300" y="284">③ C はもう入れ物に入っているので、描かずにスクロールだけ。</text>
    <text x="300" y="306">④ 空いた時間に、先のコマ D を前もって描いておく（先回り）。</text>
  </g>
  <text x="300" y="336" font-size="11" fill="#666">差分（diff）のときは、描く先の入れ物に今ある絵との違いだけを描く。</text>
</svg>
