<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans CJK JP',sans-serif" font-size="13">
  <!-- TMWA と VWAIT の違い：VWAIT 4（TMWA 4）を 3 回。1 回目の前の描画が 6 カウントかかったとき -->
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="20" y="24" font-size="14" font-weight="bold" fill="#222">例：待ち 4 カウントを 3 回。1 回目の前の描画が 6 カウントかかったとき</text>

  <!-- 時間の軸（1 カウント＝36px、0 は x=160） -->
  <g fill="#555" text-anchor="middle" font-size="12">
    <text x="160" y="52">0</text><text x="232" y="52">2</text><text x="304" y="52">4</text><text x="376" y="52">6</text>
    <text x="448" y="52">8</text><text x="520" y="52">10</text><text x="592" y="52">12</text><text x="664" y="52">14</text>
  </g>
  <text x="20" y="52" font-size="12" fill="#555">時刻（カウント）</text>
  <line x1="160" y1="60" x2="664" y2="60" stroke="#888"/>
  <g stroke="#888">
    <line x1="160" y1="56" x2="160" y2="64"/><line x1="196" y1="58" x2="196" y2="62"/><line x1="232" y1="56" x2="232" y2="64"/>
    <line x1="268" y1="58" x2="268" y2="62"/><line x1="304" y1="56" x2="304" y2="64"/><line x1="340" y1="58" x2="340" y2="62"/>
    <line x1="376" y1="56" x2="376" y2="64"/><line x1="412" y1="58" x2="412" y2="62"/><line x1="448" y1="56" x2="448" y2="64"/>
    <line x1="484" y1="58" x2="484" y2="62"/><line x1="520" y1="56" x2="520" y2="64"/><line x1="556" y1="58" x2="556" y2="62"/>
    <line x1="592" y1="56" x2="592" y2="64"/><line x1="628" y1="58" x2="628" y2="62"/><line x1="664" y1="56" x2="664" y2="64"/>
  </g>

  <!-- 予定の時刻 4・8・12 -->
  <g stroke="#e08a00" stroke-width="2" stroke-dasharray="5 4">
    <line x1="304" y1="66" x2="304" y2="118"/><line x1="304" y1="142" x2="304" y2="194"/><line x1="304" y1="214" x2="304" y2="224"/><line x1="448" y1="66" x2="448" y2="118"/><line x1="448" y1="142" x2="448" y2="194"/><line x1="448" y1="214" x2="448" y2="224"/><line x1="592" y1="66" x2="592" y2="118"/><line x1="592" y1="142" x2="592" y2="194"/><line x1="592" y1="214" x2="592" y2="224"/>
  </g>
  <g fill="#e08a00" font-size="12" text-anchor="middle">
    <text x="304" y="236">予定 4</text><text x="448" y="236">予定 8</text><text x="592" y="236">予定 12</text>
  </g>

  <!-- TMWA：前に抜けた時刻から 4 を数える -->
  <text x="20" y="99" font-weight="bold" fill="#222">TMWA</text>
  <g stroke="#ffffff" stroke-width="1">
    <rect x="160" y="80" width="216" height="28" fill="#4a7bd0"/>
    <rect x="376" y="80" width="72" height="28" fill="#4a7bd0"/>
    <rect x="448" y="80" width="72" height="28" fill="#dfe5ee"/>
    <rect x="520" y="80" width="72" height="28" fill="#4a7bd0"/>
    <rect x="592" y="80" width="72" height="28" fill="#dfe5ee"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="268" y="99" fill="#fff">描画 6（予定の 4 を過ぎる）</text>
    <text x="412" y="99" fill="#fff">描画 2</text><text x="484" y="99" fill="#555">待ち 2</text>
    <text x="556" y="99" fill="#fff">描画 2</text><text x="628" y="99" fill="#555">待ち 2</text>
  </g>
  <g stroke="#c0392b" stroke-width="3"><line x1="376" y1="74" x2="376" y2="114"/><line x1="520" y1="74" x2="520" y2="114"/><line x1="664" y1="74" x2="664" y2="114"/></g>
  <text x="160" y="132" font-size="12" fill="#c0392b" stroke="#fff" stroke-width="5" paint-order="stroke">抜ける時刻 6 → 10 → 14：前に抜けた時刻から 4 を数えるので、遅れ 2 がずっと残る</text>

  <!-- VWAIT：予定の時刻まで待つ -->
  <text x="20" y="175" font-weight="bold" fill="#222">VWAIT</text>
  <g stroke="#ffffff" stroke-width="1">
    <rect x="160" y="156" width="216" height="28" fill="#4a7bd0"/>
    <rect x="376" y="156" width="72" height="28" fill="#4a7bd0"/>
    <rect x="448" y="156" width="72" height="28" fill="#4a7bd0"/>
    <rect x="520" y="156" width="72" height="28" fill="#dfe5ee"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="268" y="175" fill="#fff">描画 6（予定の 4 を過ぎる）</text>
    <text x="412" y="175" fill="#fff">描画 2</text>
    <text x="484" y="175" fill="#fff">描画 2</text><text x="556" y="175" fill="#555">待ち 2</text>
  </g>
  <g stroke="#c0392b" stroke-width="3"><line x1="376" y1="150" x2="376" y2="190"/><line x1="448" y1="150" x2="448" y2="190"/><line x1="592" y1="150" x2="592" y2="190"/></g>
  <text x="160" y="208" font-size="12" fill="#1e7e34" stroke="#fff" stroke-width="5" paint-order="stroke">抜ける時刻 6 → 8 → 12：予定の時刻（4・8・12）まで待つので、2 回目で予定に戻る</text>

  <!-- 凡例 -->
  <g font-size="12" fill="#333">
    <rect x="160" y="262" width="18" height="14" fill="#4a7bd0"/><text x="184" y="274">描画</text>
    <rect x="236" y="262" width="18" height="14" fill="#dfe5ee" stroke="#bbb"/><text x="260" y="274">待ち</text>
    <line x1="320" y1="260" x2="320" y2="278" stroke="#c0392b" stroke-width="3"/><text x="328" y="274">待ちを抜ける（次の描画へ）</text>
    <line x1="500" y1="269" x2="530" y2="269" stroke="#e08a00" stroke-width="2" stroke-dasharray="5 4"/><text x="536" y="274">予定の時刻</text>
  </g>
</svg>
